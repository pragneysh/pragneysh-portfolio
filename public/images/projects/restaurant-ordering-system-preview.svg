<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" rx="16" fill="#0D1117"/>
  <defs>
    <linearGradient id="rosGrad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181524"/>
      <stop offset="100%" stop-color="#0E0B16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#rosGrad)"/>
  <rect x="1" y="1" width="798" height="448" rx="15" stroke="#322B42" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <path d="M0 16C0 7.16344 7.16344 0 16 0H784C792.837 0 800 7.16344 800 16V48H0V16Z" fill="#1A1626"/>
  <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="68" cy="24" r="6" fill="#27C93F"/>
  <text x="100" y="29" fill="#9D93B0" font-family="Inter, sans-serif" font-size="13" font-weight="500">Restaurant Ordering System — Real-Time Serverless Architecture</text>
  <rect x="670" y="14" width="105" height="20" rx="10" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="684" y="28" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="600">SERVERLESS</text>

  <!-- Left Main Panel -->
  <rect x="36" y="68" width="470" height="346" rx="12" fill="#14111E" stroke="#322B42"/>
  <text x="56" y="100" fill="#F5F3FF" font-family="Manrope, sans-serif" font-size="17" font-weight="700">Real-Time In-Dining Ordering &amp; Kitchen Stream</text>
  <text x="56" y="122" fill="#9D93B0" font-family="Inter, sans-serif" font-size="12">QR-driven session initialization, event-triggered Lambda orders &amp; DynamoDB state</text>

  <!-- Step 1 -->
  <rect x="56" y="142" width="430" height="48" rx="8" fill="#1A1626" stroke="#322B42"/>
  <circle cx="78" cy="166" r="10" fill="#8B5CF6" fill-opacity="0.25"/>
  <text x="74" y="170" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="700">1</text>
  <text x="98" y="161" fill="#EDE9FE" font-family="Inter, sans-serif" font-size="12" font-weight="600">QR Table Session &amp; Digital Menu Catalog</text>
  <text x="98" y="178" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">Diner scans table QR, fetches cached menu from Amazon CloudFront &amp; S3</text>

  <!-- Step 2 -->
  <rect x="56" y="200" width="430" height="48" rx="8" fill="#1A1626" stroke="#322B42"/>
  <circle cx="78" cy="224" r="10" fill="#EC4899" fill-opacity="0.25"/>
  <text x="74" y="228" fill="#F472B6" font-family="Inter, sans-serif" font-size="11" font-weight="700">2</text>
  <text x="98" y="219" fill="#EDE9FE" font-family="Inter, sans-serif" font-size="12" font-weight="600">Event-Driven Order Processing (API Gateway + Lambda)</text>
  <text x="98" y="236" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">Sub-second order ingestion with NestJS serverless microservice execution</text>

  <!-- Step 3 -->
  <rect x="56" y="258" width="430" height="48" rx="8" fill="#1A1626" stroke="#322B42"/>
  <circle cx="78" cy="282" r="10" fill="#10B981" fill-opacity="0.25"/>
  <text x="74" y="286" fill="#34D399" font-family="Inter, sans-serif" font-size="11" font-weight="700">3</text>
  <text x="98" y="277" fill="#EDE9FE" font-family="Inter, sans-serif" font-size="12" font-weight="600">DynamoDB State &amp; Kitchen Display Routing</text>
  <text x="98" y="294" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">Atomic status mutations: Received → Preparing → Served → Settled</text>

  <!-- Serverless Strip -->
  <rect x="56" y="318" width="430" height="78" rx="8" fill="#1A1626" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="72" y="342" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="700">SERVERLESS RESILIENCE &amp; COST EFFICIENCY</text>
  <text x="72" y="362" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">• Zero idle server cost — scales dynamically from 0 to peak restaurant rush</text>
  <text x="72" y="380" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">• High availability across AWS ap-south-1 multi-AZ infrastructure</text>

  <!-- Right Panel -->
  <rect x="522" y="68" width="242" height="346" rx="12" fill="#14111E" stroke="#322B42"/>
  <text x="542" y="100" fill="#F5F3FF" font-family="Manrope, sans-serif" font-size="15" font-weight="700">Technology Stack</text>

  <g transform="translate(542, 116)">
    <rect width="100" height="28" rx="6" fill="#1A1626" stroke="#322B42"/>
    <text x="14" y="18" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="600">React 18</text>

    <rect x="110" width="92" height="28" rx="6" fill="#1A1626" stroke="#322B42"/>
    <text x="122" y="18" fill="#F472B6" font-family="Inter, sans-serif" font-size="11" font-weight="600">NestJS</text>

    <rect y="36" width="100" height="28" rx="6" fill="#1A1626" stroke="#322B42"/>
    <text x="14" y="54" fill="#F59E0B" font-family="Inter, sans-serif" font-size="11" font-weight="600">AWS Lambda</text>

    <rect x="110" y="36" width="92" height="28" rx="6" fill="#1A1626" stroke="#322B42"/>
    <text x="118" y="54" fill="#60A5FA" font-family="Inter, sans-serif" font-size="11" font-weight="600">API Gateway</text>

    <rect y="72" width="100" height="28" rx="6" fill="#1A1626" stroke="#322B42"/>
    <text x="14" y="90" fill="#34D399" font-family="Inter, sans-serif" font-size="11" font-weight="600">DynamoDB</text>

    <rect x="110" y="72" width="92" height="28" rx="6" fill="#1A1626" stroke="#322B42"/>
    <text x="120" y="90" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="600">AWS S3</text>
  </g>

  <!-- Right Metrics Card -->
  <rect x="542" y="240" width="202" height="156" rx="8" fill="#1A1626" stroke="#322B42"/>
  <text x="558" y="266" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">Workload Profile:</text>
  <text x="558" y="284" fill="#EDE9FE" font-family="Manrope, sans-serif" font-size="13" font-weight="700">Real-Time Ingest</text>

  <text x="558" y="312" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">Latency Target:</text>
  <text x="558" y="330" fill="#34D399" font-family="Manrope, sans-serif" font-size="13" font-weight="700">&lt; 150ms Response</text>

  <text x="558" y="358" fill="#9D93B0" font-family="Inter, sans-serif" font-size="11">State Engine:</text>
  <text x="558" y="376" fill="#C4B5FD" font-family="Manrope, sans-serif" font-size="13" font-weight="700">DynamoDB NoSQL</text>
</svg>
